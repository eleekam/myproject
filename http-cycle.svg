<svg xmlns="http://www.w3.org/2000/svg" width="740" height="245" viewBox="0 0 740 245" role="img" aria-label="Informational web protocol diagram"><rect width="740" height="245" rx="18" fill="#f1f8fb"/><g font-family="Arial" font-size="19" text-anchor="middle" fill="#183c54"><rect x="20" y="80" width="156" height="87" rx="10" fill="#fff" stroke="#67a6bb" stroke-width="3"/><text x="98" y="112">1. Enter</text><text x="98" y="140">a URL</text><rect x="202" y="80" width="156" height="87" rx="10" fill="#fff" stroke="#67a6bb" stroke-width="3"/><text x="280" y="112">2. Send</text><text x="280" y="140">request</text><rect x="384" y="80" width="156" height="87" rx="10" fill="#fff" stroke="#67a6bb" stroke-width="3"/><text x="462" y="112">3. Receive</text><text x="462" y="140">response</text><rect x="566" y="80" width="156" height="87" rx="10" fill="#fff" stroke="#67a6bb" stroke-width="3"/><text x="644" y="112">4. Display</text><text x="644" y="140">page</text></g><g stroke="#267e9f" stroke-width="4" fill="none"><path d="M178 124h20m-9 -9l10 9 -10 9M360 124h20m-9 -9l10 9 -10 9M542 124h20m-9 -9l10 9 -10 9"/></g></svg>